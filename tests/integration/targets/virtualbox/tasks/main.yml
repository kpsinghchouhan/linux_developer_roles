---
- name: Gather the facts the role needs
  ansible.builtin.setup:
    gather_subset:
      - min

- name: Test the role on macOS
  when: ansible_facts['os_family'] == 'Darwin'
  block:
    - name: Apply the virtualbox role
      ansible.builtin.include_role:
        name: kpsinghchouhan.linux_developer_roles.virtualbox
      vars:
        virtualbox_sudo_password: "{{ ansible_become_password | default(omit) }}"

    - name: Run VBoxManage --version
      ansible.builtin.command: /Applications/VirtualBox.app/Contents/MacOS/VBoxManage --version
      register: __virtualbox_test_version
      changed_when: false

    - name: Assert that VirtualBox is installed
      ansible.builtin.assert:
        that:
          - "__virtualbox_test_version['stdout'] is match('[0-9]+[.][0-9]+')"

- name: Test the role on other platforms
  when: ansible_facts['os_family'] != 'Darwin'
  block:
    - name: Apply the virtualbox role
      ansible.builtin.include_role:
        name: kpsinghchouhan.linux_developer_roles.virtualbox

    - name: Fail because the role did not fail
      ansible.builtin.fail:
        msg: The virtualbox role should fail on platforms other than macOS.

  rescue:
    - name: Assert that the role failed because the platform is not macOS
      ansible.builtin.assert:
        that:
          - "'supports macOS only' in ansible_failed_result['msg']"
