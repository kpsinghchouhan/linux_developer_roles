---
- name: Gather the facts the role needs
  ansible.builtin.setup:
    gather_subset:
      - min

- name: Test the role on macOS
  when: ansible_facts['os_family'] == 'Darwin'
  block:
    - name: Apply the notion role
      ansible.builtin.include_role:
        name: kpsinghchouhan.linux_developer_roles.notion

    - name: Find the Notion app
      ansible.builtin.stat:
        path: /Applications/Notion.app
      register: __notion_test_app

    - name: Assert that Notion is installed
      ansible.builtin.assert:
        that:
          - __notion_test_app['stat']['exists']

- name: Test the role on other platforms
  when: ansible_facts['os_family'] != 'Darwin'
  block:
    - name: Apply the notion role
      ansible.builtin.include_role:
        name: kpsinghchouhan.linux_developer_roles.notion

    - name: Fail because the role did not fail
      ansible.builtin.fail:
        msg: The notion role should fail on platforms other than macOS.

  rescue:
    - name: Assert that the role failed because the platform is not macOS
      ansible.builtin.assert:
        that:
          - "'supports macOS only' in ansible_failed_result['msg']"
