---
# tasks file for kpsinghchouhan.linux_developer_roles.visual_studio_code

- name: Check that the host runs macOS
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Darwin'
    fail_msg: "The visual_studio_code role supports macOS only. This host is {{ ansible_facts['os_family'] }}."
    quiet: true

# The cask is marked auto_updates, so Homebrew only upgrades it with --greedy
- name: Install Visual Studio Code cask with Homebrew
  community.general.homebrew_cask:
    name: "{{ __visual_studio_code_cask_name }}"
    state: "{{ visual_studio_code_package_state }}"
    greedy: "{{ visual_studio_code_package_state == 'latest' }}"
  become: false
