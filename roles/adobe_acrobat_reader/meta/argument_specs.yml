---
# argument spec file for kpsinghchouhan.linux_developer_roles.adobe_acrobat_reader

argument_specs:
  main:
    short_description: Install Adobe Acrobat Reader on macOS.
    description:
      - Installs Adobe Acrobat Reader with a Homebrew cask on macOS. Other platforms are not supported.
    author:
      - Krishana Pal Singh Chouhan
    options:
      adobe_acrobat_reader_package_state:
        type: str
        description: State of the cask. Use 'latest' to upgrade an existing install.
        choices: ["present", "latest"]
        default: "present"
      adobe_acrobat_reader_sudo_password:
        type: str
        description:
          - Password for the sudo prompt of the cask's .pkg installer.
          - Not needed if the user has passwordless sudo.
        no_log: true
