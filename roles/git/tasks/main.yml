---
# tasks file for kpsinghchouhan.linux_developer_roles.git

- name: "Install and configure git for {{ ansible_facts['os_family'] }}"
  ansible.builtin.include_tasks: "install_{{ ansible_facts['os_family'] | lower }}.yml"

- name: "Configure .gitconfig for user {{ ansible_facts['user_id'] }}"
  ansible.builtin.template:
    src: gitconfig.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.gitconfig"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "{{ git_config_mode }}"
