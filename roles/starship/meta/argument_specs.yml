---
# argument spec file for kpsinghchouhan.linux_developer_roles.starship

argument_specs:
  main:
    short_description: Install the starship prompt and manage ~/.config/starship.toml.
    description:
      - Installs starship from its GitHub release on Ubuntu or with Homebrew on macOS.
      - Copies starship.toml to ~/.config for the connecting user and adds the starship init line to the shell rc files.
    author:
      - Krishana Pal Singh Chouhan
    options:
      starship_version:
        type: str
        description:
          - Starship release to install, such as '1.23.0', or 'latest'. Ubuntu only.
          - With 'latest', an existing starship is left in place. Pin a version to upgrade.
        default: "latest"
      starship_install_dir:
        type: str
        description: Directory where the starship binary is installed. Ubuntu only.
        default: "/usr/local/bin"
      starship_package_state:
        type: str
        description: State of the Homebrew package. Use 'latest' to upgrade an existing install. macOS only.
        choices: ["present", "latest"]
        default: "present"
      starship_config_src:
        type: str
        description:
          - Source of starship.toml. A file name in the role's files/ directory, or a path on the controller.
        default: "starship.toml"
      starship_config_home:
        type: str
        description:
          - Home directory that gets .config/starship.toml and the shell rc files.
          - Defaults to the connecting user's HOME.
      starship_config_mode:
        type: str
        description: File mode of starship.toml.
        default: "0644"
      starship_shells:
        type: list
        elements: str
        description: Shells whose rc file (~/.bashrc, ~/.zshrc) gets the starship init line. Use [] to skip.
        choices: ["bash", "zsh"]
        default: ["bash", "zsh"]
