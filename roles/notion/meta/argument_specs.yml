---
# argument spec file for kpsinghchouhan.linux_developer_roles.notion

argument_specs:
  main:
    short_description: Install the Notion desktop app on macOS.
    description:
      - Installs the Notion desktop app with a Homebrew cask on macOS. Other platforms are not supported.
    author:
      - Krishana Pal Singh Chouhan
    options:
      notion_package_state:
        type: str
        description:
          - State of the cask. Use 'latest' to upgrade an existing install through Homebrew.
          - Notion also updates itself, so 'present' is enough for most hosts.
        choices: ["present", "latest"]
        default: "present"
