---
# argument spec file for kpsinghchouhan.linux_developer_roles.hashicorp_vagrant

argument_specs:
  main:
    short_description: Install HashiCorp Vagrant on macOS.
    description:
      - Installs Vagrant with a Homebrew cask on macOS. Other platforms are not supported.
    author:
      - Krishana Pal Singh Chouhan
    options:
      hashicorp_vagrant_package_state:
        type: str
        description: State of the cask. Use 'latest' to upgrade an existing install.
        choices: ["present", "latest"]
        default: "present"
      hashicorp_vagrant_sudo_password:
        type: str
        description:
          - Password for the sudo prompt of the cask's .pkg installer.
          - Not needed if the user has passwordless sudo.
        no_log: true
