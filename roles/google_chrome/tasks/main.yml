---
# tasks file for kpsinghchouhan.linux_developer_roles.google_chrome

- name: Check that the host runs macOS
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Darwin'
    fail_msg: "The google_chrome role supports macOS only. This host is {{ ansible_facts['os_family'] }}."
    quiet: true

# The cask is marked auto_updates, so Homebrew only upgrades it with --greedy
- name: Install Google Chrome cask with Homebrew
  community.general.homebrew_cask:
    name: "{{ __google_chrome_cask_name }}"
    state: "{{ google_chrome_package_state }}"
    greedy: "{{ google_chrome_package_state == 'latest' }}"
  become: false
