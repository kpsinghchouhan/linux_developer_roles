---
# argument spec file for kpsinghchouhan.linux_developer_roles.zed

argument_specs:
  main:
    short_description: Install the Zed editor on macOS.
    description:
      - Installs Zed with a Homebrew cask on macOS. Other platforms are not supported.
    author:
      - Krishana Pal Singh Chouhan
    options:
      zed_package_state:
        type: str
        description:
          - State of the cask. Use 'latest' to upgrade an existing install through Homebrew.
          - Zed also updates itself, so 'present' is enough for most hosts.
        choices: ["present", "latest"]
        default: "present"
