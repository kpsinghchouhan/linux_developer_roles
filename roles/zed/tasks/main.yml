---
# tasks file for kpsinghchouhan.linux_developer_roles.zed

- name: Check that the host runs macOS
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Darwin'
    fail_msg: "The zed role supports macOS only. This host is {{ ansible_facts['os_family'] }}."
    quiet: true

# The cask is marked auto_updates, so Homebrew only upgrades it with --greedy
- name: Install Zed cask with Homebrew
  community.general.homebrew_cask:
    name: "{{ __zed_cask_name }}"
    state: "{{ zed_package_state }}"
    greedy: "{{ zed_package_state == 'latest' }}"
  become: false
